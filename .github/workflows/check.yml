name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # CI 中使用环境变量注入占位哈希，不改动 flake 源文件。
      # builtins.getEnv 是 impure 读取，因此 CI 检查显式使用 --impure；
      # 正常安装不传该变量，仍由 assertion 强制用户设置真实密码。
      - run: echo 'CI_PASSWORD_HASH=$y$j9T$CI.PLACEHOLDER.NOT.A.REAL.HASH$' >> "$GITHUB_ENV"

      - run: nix flake check --impure

      # 验证三台主机的系统闭包能完整求值（只 eval 不构建，比 nix build 轻）
      # 注意：HAO_OFFLINE 的 hardware-configuration.nix 在仓库中
      # 不存在（安装时生成），CI 验证的是“无硬件配置”形态，
      # 不等于真机可装；真机安装前务必 git add -f 硬件配置
      - run: nix eval --impure .#nixosConfigurations.HAO_DESKTOP.config.system.build.toplevel.drvPath
      - run: nix eval --impure .#nixosConfigurations.HAO_OFFLINE.config.system.build.toplevel.drvPath
      - run: nix eval --impure .#nixosConfigurations.HAO_WSL.config.system.build.toplevel.drvPath
