name: build-installer-iso

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Build HAO Installer ISO
        run: nix build --accept-flake-config --no-write-lock-file .#hao-installer-iso

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p dist
          cp result/iso/*.iso dist/
          cd dist
          sha256sum ./*.iso > SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hao-installer-iso
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    needs: iso
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hao-installer-iso
          path: dist

      - name: Attach ISO to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "${{ github.repository }}"
