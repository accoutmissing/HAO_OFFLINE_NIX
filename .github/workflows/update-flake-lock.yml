# 每周自动更新 flake.lock 并创建 PR
# 仓库首次缺少 flake.lock 时，本 workflow 第一次运行就会补上；
# 之后每周跟随 nixpkgs-unstable / home-manager 上游刷新一次。
#
# 为什么要有 verify 这个 job：由 GITHUB_TOKEN 创建的 PR 不会触发 pull_request
# 事件（GitHub 防止事件级联），所以机器人 PR 上的 check 永远是
# action_required、不会自己跑起来——PR #3 就这样躺了两周才被发现。这里在
# 推完分支之后直接调用 check.yml（workflow_call）对这个分支求值，等于把
# 「必须确认 check 通过」这条规则变成自动的，不依赖谁记得去点。
#
# 仓库 Settings > Actions > General > Workflow permissions 中必须开启
# "Allow GitHub Actions to create and approve pull requests"，否则 PR 创建会失败。
name: update-flake-lock

on:
  workflow_dispatch: # 手动触发
  schedule:
    - cron: "0 8 * * 0" # 每周日 08:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    outputs:
      pull-request-number: ${{ steps.update.outputs.pull-request-number }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - id: update
        uses: DeterminateSystems/update-flake-lock@a2bbe0274e3a0c4194390a1e445f734c597ebc37 # v24
        with:
          pr-title: "chore: update flake.lock"
          pr-labels: |
            dependencies
          pr-body: |
            自动更新 flake.lock（nixpkgs-unstable / home-manager / disko / noctalia / treefmt-nix / nixos-wsl）。

            - 本 PR 由 update-flake-lock workflow 生成
            - 同一个 workflow 的 verify job 已对 update_flake_lock_action 分支跑过 check.yml，看那一次运行的结果即可
            - 如需本地生成：`nix flake lock`

  # 对机器人刚推上去的分支跑完全相同的检查（不重复定义检查项，直接复用 check.yml）。
  verify:
    needs: lockfile
    if: needs.lockfile.outputs.pull-request-number != ''
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
    with:
      ref: update_flake_lock_action
