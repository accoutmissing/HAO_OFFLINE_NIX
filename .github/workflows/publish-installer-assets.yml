name: publish-installer-assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to receive the ISO
        required: true
        type: string
      source_run_id:
        description: Successful build-installer-iso run containing hao-installer-iso
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hao-installer-iso
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: dist

      - name: Verify ISO checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.iso)
          test "${#files[@]}" -eq 1
          cd dist
          sha256sum -c SHA256SUMS

      - name: Verify build matches release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          run_sha="$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" --jq .head_sha)"
          release_sha="$(git rev-parse HEAD)"
          test "$run_sha" = "$release_sha"

      - name: Attach verified assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/*.iso dist/SHA256SUMS --clobber
